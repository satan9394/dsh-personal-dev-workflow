cases:
  - input: "解释一下这个函数为什么这样写"
    should_trigger: false
    expected_mode: null
  - input: "把 README 里的一个错别字改掉"
    should_trigger: false
    expected_mode: quick
  - input: "这个功能涉及认证、数据库和前端，先拆任务卡再开发"
    should_trigger: true
    expected_mode: standard
  - input: "按任务卡自主推进这个 Mission，上预算，不用逐卡问我"
    should_trigger: true
    expected_mode: bounded
  - input: "只审查这个仓库的风险，不要修改任何文件"
    should_trigger: true
    expected_mode: audit
  - input: "持续改进整个产品，想到什么就改什么，直到你觉得完美"
    should_trigger: true
    expected_mode: standard
    expected_behavior: "reject open-ended autonomy; require a bounded mission"
