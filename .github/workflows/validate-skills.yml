name: validate-skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # The official reference validator reads SKILL.md with read_text(), i.e. the
    # platform default encoding (audit finding F-6). On a Windows runner with a
    # zh-CN default codepage that decodes UTF-8 as GBK and crashes, so UTF-8 mode
    # is forced for every Python step in this job.
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Validate SKILL.md frontmatter and references
        run: node scripts/validate-skills.mjs
      - name: Run runstate CLI tests (Run/Mission budgets + gate)
        run: node tools/run-tests.mjs
      # Official Agent Skills reference validator, pinned to an immutable commit so
      # the gate cannot move under the repo. Both skills must pass; a non-zero exit
      # fails the job.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install official Agent Skills reference validator (pinned commit)
        run: pip install "git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - name: Validate the English skill with the official validator
        run: skills-ref validate skills/personal-dev-workflow
      - name: Validate the Chinese skill with the official validator
        run: skills-ref validate skills/personal-dev-workflow-zh
