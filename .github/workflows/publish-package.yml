name: publish-package

# NOTE (2026-10-04): automatic publish on release is intentionally disabled.
# Publishing to GitHub Packages currently fails with
#   npm error 403 ... permission_denied: write_package
# because the package `@satan9394/dsh-personal-dev-workflow` appears to still be
# linked to a previously deleted repository; clearing that needs package admin
# (delete / relink), which is outside this workflow's reach. Run this workflow
# manually via workflow_dispatch once the package ownership is resolved.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@satan9394'

      - name: Validate skills before publishing
        run: node scripts/validate-skills.mjs

      - name: Run runstate controller tests before publishing
        run: node tools/run-tests.mjs

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
